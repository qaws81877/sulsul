name: Check update feed

# Installed apps read releases/latest/download/appcast.xml. If the latest release becomes a draft or
# pre-release, loses an asset, or ships a download that does not match its signature, apps report
# "no update" without any error, so look at the feed from the outside on a schedule and on every
# release change. Scheduled workflows in a public repository are paused after 60 days without
# repository activity.

on:
  schedule:
    - cron: "17 3 * * *" # 12:17 in Korea
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: feed-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Wait for the release assets to propagate
        if: github.event_name == 'release'
        run: sleep 90

      - name: Check the feed, the download and its signature
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/scripts/check-feed.sh
